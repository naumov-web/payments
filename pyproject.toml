[tool.poetry]
name = "internal-wallet-service"
version = "0.1.0"
description = "Internal wallet and ledger platform"
authors = ["Naumov Konstantin"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }

pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"

sqlalchemy = "^2.0.32"
asyncpg = "^0.29.0"

redis = "^5.0.8"

aiokafka = "^0.11.0"

opentelemetry-api = "^1.26.0"
opentelemetry-sdk = "^1.26.0"
alembic = {version = "^1.18.4", source = "mirrors"}
psycopg = {extras = ["binary"], version = "^3.3.4"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.8"

ruff = "^0.6.2"
mypy = "^1.11.1"


[[tool.poetry.source]]
name = "mirrors"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true